name: PicoBot CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Versione da buildare (es. v0.5.0). Se vuoto usa la versione di pyproject.toml.'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================================================================
  # JOB 1: PREPARE
  # ========================================================================
  prepare:
    name: Prepare Environment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      sha: ${{ steps.get_version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          PYPROJECT=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PACKAGE=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/picobot/__init__.py)
          if [ "$PYPROJECT" != "$PACKAGE" ]; then
            echo "::error::Versione disallineata: pyproject.toml=$PYPROJECT, src/picobot/__init__.py=$PACKAGE"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ github.event.inputs.release_version }}"
            [ -z "$VERSION" ] && VERSION="v$PYPROJECT"
          fi
          # l'immagine deve contenere il codice della versione che dichiara
          if [ "${VERSION#v}" != "$PYPROJECT" ]; then
            echo "::error::La versione $VERSION non corrisponde a pyproject.toml ($PYPROJECT): aggiorna pyproject.toml e __init__.py"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "📌 Target Version: $VERSION"

  # ========================================================================
  # JOB 2: TEST
  # ========================================================================
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Python dell'immagine Docker
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node packages of the skills (deps/npm.txt)
        # come nel Dockerfile: senza, il test di test_sandbox_node con docx/pptxgenjs viene saltato
        run: |
          pkgs="$(grep -v '^[[:space:]]*#' deps/npm.txt | grep -v '^[[:space:]]*$' || true)"
          if [ -n "$pkgs" ]; then npm install -g $pkgs; fi

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Run tests with pytest
        # LLM finto: nessuna chiave API necessaria
        run: uv run pytest tests -v -rs

      - name: Test CLI
        run: |
          uv run picobot --help
          uv run picobot skills list
          uv run picobot skills validate

      - name: Run stt tests
        # servizio di trascrizione: trascrittore finto + decodifica reale OGG/Opus (nessun modello scaricato)
        run: uv run --directory stt --group dev --python ${{ matrix.python-version }} pytest tests -v

      - name: Create test summary
        if: always()
        run: |
          echo "## 🧪 Test Results - Python ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pytest + CLI | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

  # ========================================================================
  # JOB 3: DOCKER CHECK (push e pull request: build senza pubblicare)
  # ========================================================================
  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (linux/amd64, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: picobot:ci
          cache-from: type=gha,scope=picobot
          cache-to: type=gha,mode=max,scope=picobot

      - name: Smoke test image
        run: |
          docker run --rm picobot:ci python -c "import picobot; print('picobot', picobot.__version__)"
          docker run --rm picobot:ci python -m picobot skills list
          docker run --rm picobot:ci node -e "require('docx'); require('pptxgenjs'); console.log('node deps ok')"
          docker run --rm picobot:ci python -c "import openpyxl; print('openpyxl', openpyxl.__version__)"

      - name: Build stt (linux/amd64, no push)
        uses: docker/build-push-action@v5
        with:
          context: ./stt
          file: ./stt/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: picobot-stt:ci
          cache-from: type=gha,scope=stt
          cache-to: type=gha,mode=max,scope=stt

      - name: Smoke test stt image
        # import senza caricare il modello (si carica all'avvio del server)
        run: docker run --rm picobot-stt:ci python -c "import faster_whisper, main; print('stt ok')"

  # ========================================================================
  # JOB 4: BUILD DOCKER (release e avvio manuale: build multi-arch e push su GHCR)
  # ========================================================================
  build-docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [prepare, test]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      packages: write

    steps:
      # 1. CHECKOUT (DEVE ESSERE IL PRIMO)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # 2. SCANSIONE FILESYSTEM (prima del build per sicurezza)
      - name: Scan Repository for vulnerabilities (FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'  # report, non blocca la build
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          output: 'trivy-fs-report.txt'

      # 3. SETUP DOCKER
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=PicoBot
            org.opencontainers.image.description=Assistente personale multi-agente (Agno 3): Telegram, CLI, API REST
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=picobot
          cache-to: type=gha,mode=max,scope=picobot

      - name: Smoke test pushed image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          docker run --rm "$IMAGE" python -c "import picobot; print('picobot', picobot.__version__)"
          docker run --rm "$IMAGE" python -m picobot skills list

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'table'
          exit-code: '0'  # report, non blocca la build
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          output: 'trivy-image-report.txt'

      # 4. GENERAZIONE SBOM (dell'immagine pubblicata)
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json

      # 4b. IMMAGINE STT (trascrizione dei vocali)
      - name: Extract metadata (stt)
        id: meta_stt
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-stt
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=PicoBot STT
            org.opencontainers.image.description=Trascrizione vocale per PicoBot (faster-whisper su CPU, API compatibile OpenAI)
            org.opencontainers.image.licenses=MIT

      - name: Build and push (stt)
        uses: docker/build-push-action@v5
        with:
          context: ./stt
          file: ./stt/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_stt.outputs.tags }}
          labels: ${{ steps.meta_stt.outputs.labels }}
          cache-from: type=gha,scope=stt
          cache-to: type=gha,mode=max,scope=stt

      - name: Smoke test pushed image (stt)
        run: docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-stt:${{ steps.meta_stt.outputs.version }} python -c "import faster_whisper, main; print('stt ok')"

      - name: Scan image for vulnerabilities (stt)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-stt:${{ steps.meta_stt.outputs.version }}
          format: 'table'
          exit-code: '0'  # report, non blocca la build
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          output: 'trivy-stt-image-report.txt'

      - name: Generate SBOM (stt)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-stt:${{ steps.meta_stt.outputs.version }}
          format: spdx-json
          output-file: sbom-stt.spdx.json

      # 5. ASSETS E ARTIFACTS
      - name: Update Release with Security Assets
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            trivy-fs-report.txt
            trivy-image-report.txt
            sbom.spdx.json
            trivy-stt-image-report.txt
            sbom-stt.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (backup nelle Actions)
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ needs.prepare.outputs.version }}
          path: |
            trivy-fs-report.txt
            trivy-image-report.txt
            sbom.spdx.json
            trivy-stt-image-report.txt
            sbom-stt.spdx.json

      # 6. BUILD SUMMARY
      - name: Create build summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ Version | ${{ needs.prepare.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Image | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎤 Image (stt) | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-stt:${{ steps.meta_stt.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Platforms | linux/amd64, linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Built | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta_stt.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ========================================================================
  # JOB 5: NOTIFICATION (opzionale: parte solo se i secret SMTP sono configurati)
  # ========================================================================
  notify:
    name: Send Email Notification
    runs-on: ubuntu-latest
    needs: [prepare, test, build-docker]
    if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}

    steps:
      - name: Skip (SMTP non configurato)
        if: env.SMTP_SERVER == ''
        run: echo "## 📧 Notifica email saltata (secret SMTP_* non configurati)" >> $GITHUB_STEP_SUMMARY

      - name: Prepare email content
        id: email
        if: env.SMTP_SERVER != ''
        env:
          STATUS_TEST: ${{ needs.test.result }}
          STATUS_DOCKER: ${{ needs.build-docker.result }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - << 'PYEOF'
          import os, datetime

          s_test = os.environ["STATUS_TEST"]
          s_docker = os.environ["STATUS_DOCKER"]
          version = os.environ["VERSION"]
          repo = os.environ.get("GITHUB_REPOSITORY", "Unknown")

          overall = "SUCCESS" if s_test == "success" and s_docker == "success" else "FAILED"
          subject = f"PicoBot CI/CD {overall}: {version}"

          body = f"""
          PicoBot CI/CD Pipeline Report
          --------------------------------------
          Status Generale: {overall}
          Versione: {version}

          Dettaglio Job:
          - Test Suite: {s_test.upper()}
          - Docker Build: {s_docker.upper()}

          Link alla Run:
          {os.environ.get('GITHUB_SERVER_URL')}/{repo}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}

          Data: {datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')}
          --------------------------------------
          """
          with open("/tmp/email_body.txt", "w") as f: f.write(body)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"subject={subject}\n")
              f.write(f"overall={overall}\n")
          PYEOF

      - name: Send Email
        if: env.SMTP_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.email.outputs.subject }}
          body: file:///tmp/email_body.txt
          to: PicoBot CI/CD <${{ secrets.NOTIFICATION_EMAIL }}>
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          convert_markdown: false

      - name: Create notification summary
        if: env.SMTP_SERVER != ''
        env:
          STATUS_TEST: ${{ needs.test.result }}
          STATUS_DOCKER: ${{ needs.build-docker.result }}
        run: |
          echo "## 📧 Email Notification Sent" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.email.outputs.overall }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Subject:** ${{ steps.email.outputs.subject }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Suite:** ${STATUS_TEST}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Build:** ${STATUS_DOCKER}" >> $GITHUB_STEP_SUMMARY
